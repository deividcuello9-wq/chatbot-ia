<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pizza Nova</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
  .chat-box { background: white; width: 400px; height: 600px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
  .header { background: #e63946; color: white; padding: 16px; text-align: center; font-size: 18px; font-weight: bold; }
  .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
  .msg.bot { background: #f0f0f0; color: #333; align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.user { background: #e63946; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
  .input-area { display: flex; padding: 12px; gap: 8px; border-top: 1px solid #eee; }
  input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 24px; outline: none; font-size: 14px; }
  button { background: #e63946; color: white; border: none; padding: 10px 18px; border-radius: 24px; cursor: pointer; font-size: 14px; }
  button:hover { background: #c1121f; }
</style>
</head>
<body>
<div class="chat-box">
  <div class="header">Pizza Nova</div>
  <div class="messages" id="messages">
    <div class="msg bot">Hola! Bienvenido a Pizza Nova. En que te puedo ayudar?</div>
  </div>
  <div class="input-area">
    <input type="text" id="input" placeholder="Escribe tu mensaje..." onkeypress="if(event.key==='Enter')enviar()"/>
    <button onclick="enviar()">Enviar</button>
  </div>
</div>
<script>
async function enviar() {
  const input = document.getElementById("input");
  const texto = input.value.trim();
  if (!texto) return;
  agregar("user", texto);
  input.value = "";
  const res = await fetch("/chat", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({mensaje: texto}) });
  const data = await res.json();
  agregar("bot", data.respuesta);
}
function agregar(tipo, texto) {
  const div = document.createElement("div");
  div.className = "msg " + tipo;
  div.textContent = texto;
  const msgs = document.getElementById("messages");
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}
</script>
</body>
</html>
